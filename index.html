<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECD-AIG Planning</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14213d;
      --muted: #5d6878;
      --line: #d8dee8;
      --panel: #ffffff;
      --bg: #f5f7fa;
      --teal: #087f8c;
      --navy: #143d73;
      --amber: #b56b00;
      --danger: #a83a32;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 Arial, sans-serif; }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header .wrap { padding: 22px 0 18px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    h2 { margin: 0 0 14px; font-size: 18px; letter-spacing: 0; }
    p { margin: 6px 0; }
    .sub { color: var(--muted); }
    main { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px; padding: 20px 0 32px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
    .form-panel { align-self: start; }
    label { display: block; margin-top: 12px; color: #26364e; font-weight: 700; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-weight: 400; }
    .check input { width: auto; margin: 0; }
    input, textarea, select {
      width: 100%; margin-top: 5px; padding: 10px 11px; border: 1px solid #bfc8d5;
      border-radius: 4px; background: #fff; color: #1a2b45; font: inherit;
    }
    textarea { min-height: 84px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 104px; gap: 10px; }
    button {
      border: 0; border-radius: 4px; padding: 10px 13px; color: #fff; background: var(--navy);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { cursor: wait; opacity: .58; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .secondary { background: #4d5d72; }
    .notice { margin-top: 14px; padding: 10px 12px; border-left: 3px solid var(--amber); background: #fff8eb; color: #684106; }
    .status { margin: 0 0 13px; color: var(--muted); }
    .status.error { color: var(--danger); }
    .empty { min-height: 240px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: #344359; font-size: 13px; }
    th:first-child, td:first-child { width: 76px; }
    th:last-child, td:last-child { width: 35%; }
    code { color: #3e4c5f; white-space: pre-wrap; word-break: break-word; }
    details { margin-top: 16px; color: var(--muted); }
    summary { cursor: pointer; color: #344359; font-weight: 700; }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      th:last-child, td:last-child { width: 32%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>ECD-AIG 후보 문항 생성</h1>
      <p class="sub">응답자료 수집 전 단계에서 ECD 계보를 유지한 후보 문항을 생성하고, 중복을 제거합니다.</p>
    </div>
  </header>
  <main class="wrap">
    <section class="form-panel">
      <h2>생성 조건</h2>
      <label for="key">Google AI Studio API 키</label>
      <input id="key" type="password" autocomplete="off" placeholder="이 브라우저 탭에서만 사용">
      <label class="check" for="remember-key">
        <input id="remember-key" type="checkbox">
        이 브라우저에 API 키 기억하기
      </label>

      <label for="construct">측정 구인</label>
      <input id="construct" value="업무 상황에서 경험하는 걱정">

      <label for="ksa">KSA 또는 하위 특성</label>
      <input id="ksa" value="업무 부담 상황에서 나타나는 걱정 반응">

      <label for="claim">증거 주장</label>
      <textarea id="claim">응답자는 서로 다른 구체적 업무 상황에서 경험하는 단일 걱정 반응의 정도를 보고할 수 있다.</textarea>

      <label for="brief">문항 생성 조건</label>
      <textarea id="brief">서로 다른 구체적 업무 상황을 사용한다. 한 문항에는 한 가지 상황과 한 가지 감정 반응만 포함한다. 문항 간 표현과 맥락을 반복하지 않는다.</textarea>

      <div class="row">
        <label for="scale">응답 척도
          <select id="scale">
            <option>전혀 그렇지 않다 | 그렇지 않다 | 보통이다 | 그렇다 | 매우 그렇다</option>
            <option>전혀 아니다 | 약간 아니다 | 보통이다 | 약간 그렇다 | 매우 그렇다</option>
          </select>
        </label>
        <label for="count">생성 개수
          <input id="count" type="number" min="1" max="30" value="10">
        </label>
      </div>

      <div class="actions">
        <button id="generate">후보 문항 생성</button>
        <button id="download" class="secondary" disabled>결과 JSON 저장</button>
      </div>
      <p class="notice">API 키는 GitHub로 전송하지 않습니다. 기억하기를 선택하면 이 브라우저에 저장됩니다. 공용 PC에서는 사용하지 마세요.</p>
      <details>
        <summary>검증 범위</summary>
        <p>이 화면은 생성 문항의 경험적 타당도를 입증하지 않습니다. 신뢰도, 문항-총점 상관, IRT, DIF 분석은 실제 응답자료가 수집된 이후 수행합니다.</p>
      </details>
    </section>

    <section>
      <h2>후보 문항</h2>
      <p id="status" class="status">생성 조건을 입력하고 버튼을 누르세요.</p>
      <div id="result" class="empty">생성된 문항이 여기에 표시됩니다.</div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { items: [] };
    const keyStorageName = "ecd-aig-gemini-api-key";

    const rememberedKey = localStorage.getItem(keyStorageName);
    if (rememberedKey) {
      $("key").value = rememberedKey;
      $("remember-key").checked = true;
    }

    function syncRememberedKey() {
      const key = $("key").value.trim();
      if ($("remember-key").checked && key) localStorage.setItem(keyStorageName, key);
      else localStorage.removeItem(keyStorageName);
    }

    $("key").addEventListener("input", syncRememberedKey);
    $("remember-key").addEventListener("change", syncRememberedKey);

    function normalize(text) {
      return text.replace(/\s+/g, "").toLowerCase();
    }

    function schema(count) {
      return {
        type: "object",
        properties: {
          items: {
            type: "array",
            minItems: count,
            maxItems: count,
            items: {
              type: "object",
              properties: {
                stem: { type: "string" },
                situation: { type: "string" },
                response_signal: { type: "string" },
                rationale: { type: "string" }
              },
              required: ["stem", "situation", "response_signal", "rationale"]
            }
          }
        },
        required: ["items"]
      };
    }

    function promptFor(count, excluded) {
      const context = {
        construct: $("construct").value.trim(),
        ksa: $("ksa").value.trim(),
        evidence_claim: $("claim").value.trim(),
        generation_brief: $("brief").value.trim(),
        response_scale: $("scale").value.split(" | "),
        excluded_items: excluded,
        candidate_count: count
      };
      return `You generate Korean assessment item candidates for expert review before pilot administration.
Generate exactly ${count} items.
Preserve the construct, KSA, and evidence claim supplied below.
Each item must use one concrete situation and one response signal.
Use a genuinely different situation and wording for each item.
Do not repeat or lightly paraphrase any excluded item.
Do not claim empirical validity, reliability, IRT calibration, or DIF evidence.
Return only the requested JSON.

Approved design context:
${JSON.stringify(context, null, 2)}`;
    }

    async function callGemini(key, count, excluded) {
      const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptFor(count, excluded) }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseJsonSchema: schema(count)
          }
        })
      });
      if (!response.ok) throw new Error(`Gemini API 오류 ${response.status}: ${await response.text()}`);
      const raw = await response.json();
      const text = raw.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error("Gemini 응답에서 문항 JSON을 찾지 못했습니다.");
      return JSON.parse(text).items;
    }

    function unique(items, accepted) {
      const seenStems = new Set(accepted.map((item) => normalize(item.stem)));
      const seenPairs = new Set(accepted.map((item) => `${normalize(item.situation)}|${normalize(item.response_signal)}`));
      return items.filter((item) => {
        if (!item.stem || !item.situation || !item.response_signal) return false;
        const stem = normalize(item.stem);
        const pair = `${normalize(item.situation)}|${normalize(item.response_signal)}`;
        if (seenStems.has(stem) || seenPairs.has(pair)) return false;
        seenStems.add(stem);
        seenPairs.add(pair);
        return true;
      });
    }

    function render(items) {
      const rows = items.map((item, index) => `<tr>
        <td>LLM-${String(index + 1).padStart(3, "0")}</td>
        <td>${escapeHtml(item.stem)}</td>
        <td><code>${escapeHtml(item.situation)} / ${escapeHtml(item.response_signal)}</code></td>
      </tr>`).join("");
      $("result").className = "";
      $("result").innerHTML = `<table><thead><tr><th>ID</th><th>문항</th><th>상황 / 반응</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function escapeHtml(text) {
      const node = document.createElement("div");
      node.textContent = text;
      return node.innerHTML;
    }

    $("generate").addEventListener("click", async () => {
      const key = $("key").value.trim();
      const count = Math.max(1, Math.min(30, Number($("count").value) || 10));
      if (!key) return setStatus("Google AI Studio API 키를 입력하세요.", true);
      syncRememberedKey();
      if (!$("construct").value.trim() || !$("claim").value.trim()) return setStatus("측정 구인과 증거 주장을 입력하세요.", true);
      $("generate").disabled = true;
      $("download").disabled = true;
      state.items = [];
      try {
        for (let attempt = 1; attempt <= 4 && state.items.length < count; attempt++) {
          const remaining = count - state.items.length;
          setStatus(`Gemini 호출 중: ${attempt}차 시도, 남은 문항 ${remaining}개`);
          const batch = await callGemini(key, remaining, state.items);
          state.items.push(...unique(batch, state.items));
        }
        if (state.items.length < count) throw new Error(`중복 제거 후 ${state.items.length}개만 남았습니다. 생성 조건을 더 구체화하거나 개수를 줄여 다시 시도하세요.`);
        state.items = state.items.slice(0, count).map((item, index) => ({
          id: `LLM-${String(index + 1).padStart(3, "0")}`,
          ...item,
          lineage: {
            construct: $("construct").value.trim(),
            ksa: $("ksa").value.trim(),
            evidence_claim: $("claim").value.trim()
          },
          status: "expert_review_required"
        }));
        render(state.items);
        setStatus(`${state.items.length}개의 고유 후보 문항을 생성했습니다. 전문가 검토가 필요합니다.`);
        $("download").disabled = false;
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        $("generate").disabled = false;
      }
    });

    $("download").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ generated_at: new Date().toISOString(), items: state.items }, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "ecd-aig-candidates.json";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    function setStatus(message, error = false) {
      $("status").textContent = message;
      $("status").className = error ? "status error" : "status";
    }
  </script>
</body>
</html>
